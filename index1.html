<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepsis Risk Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4e8f0);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section h2 {
            color: #3498db;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .required:after {
            content: " *";
            color: red;
        }
        button {
            background: linear-gradient(to right, #3498db, #6dd5fa);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin: 30px auto 0;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        .note {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sepsis Risk Assessment Tool</h1>
        
        <form method="POST">
            <div class="form-section">
                <h2>Vital Signs</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="required">Heart Rate (bpm)</label>
                        <input name="heart_rate" type="number" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Oxygen Saturation (%)</label>
                        <input name="o2sat" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Temperature (°C)</label>
                        <input name="temp" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Systolic BP (mmHg)</label>
                        <input name="sbp" type="number" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Mean Arterial Pressure</label>
                        <input name="map" type="number" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Diastolic BP (mmHg)</label>
                        <input name="dbp" type="number" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Respiratory Rate</label>
                        <input name="resp" type="number" required>
                    </div>
                    <div class="form-group">
                        <label>End Tidal CO2 (mmHg)</label>
                        <input name="etco2" type="number" step="0.1">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Blood Gas Analysis</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Base Excess (mEq/L)</label>
                        <input name="base_excess" type="number" step="0.1">
                    </div>
                    <div class="form-group">
                        <label class="required">Bicarbonate (mEq/L)</label>
                        <input name="hco3" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>FiO2</label>
                        <input name="fio2" type="number" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="required">pH</label>
                        <input name="ph" type="number" step="0.01" min="6.5" max="8" required>
                    </div>
                    <div class="form-group">
                        <label class="required">PaCO2 (mmHg)</label>
                        <input name="paco2" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">SaO2 (%)</label>
                        <input name="sao2" type="number" step="0.1" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Laboratory Values</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>AST (U/L)</label>
                        <input name="ast" type="number">
                    </div>
                    <div class="form-group">
                        <label class="required">BUN (mg/dL)</label>
                        <input name="bun" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Alkaline Phosphatase (U/L)</label>
                        <input name="alk_phos" type="number">
                    </div>
                    <div class="form-group">
                        <label class="required">Calcium (mg/dL)</label>
                        <input name="calcium" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Chloride (mEq/L)</label>
                        <input name="chloride" type="number" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Creatinine (mg/dL)</label>
                        <input name="creatinine" type="number" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Direct Bilirubin (mg/dL)</label>
                        <input name="direct_bilirubin" type="number" step="0.1">
                    </div>
                    <div class="form-group">
                        <label class="required">Glucose (mg/dL)</label>
                        <input name="glucose" type="number" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Lactate (mmol/L)</label>
                        <input name="lactate" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Magnesium (mg/dL)</label>
                        <input name="magnesium" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Phosphate (mg/dL)</label>
                        <input name="phosphate" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Potassium (mEq/L)</label>
                        <input name="potassium" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Total Bilirubin (mg/dL)</label>
                        <input name="total_bilirubin" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Troponin I (ng/mL)</label>
                        <input name="troponin" type="number" step="0.01">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Hematology</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="required">Hematocrit (%)</label>
                        <input name="hct" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Hemoglobin (g/dL)</label>
                        <input name="hgb" type="number" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>PTT (sec)</label>
                        <input name="ptt" type="number">
                    </div>
                    <div class="form-group">
                        <label class="required">WBC (cells/uL)</label>
                        <input name="wbc" type="number" required>
                    </div>
                </div>
            </div>
            <div class="form-section">
                <h2>Patient</h2>
                <div class="form-group">
                    <div class="input-group">
                        <label for="age" class="required-field">Age (years)</label>
                        <input type="number" id="age" name="age" placeholder="Enter patient age" min="0" max="120" required>
                    </div>
                    <div class="input-group">
                        <label for="gender" class="required-field">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="hr_age_ratio" class="required-field">HR/Age Ratio</label>
                        <input type="number" step="0.01" id="hr_age_ratio" name="hr_age_ratio" placeholder="Enter HR/Age ratio" required>
                    </div>
                </div>
    
               
         
            </div>            

            <button type="submit">Assess Sepsis Risk</button>
            <p class="note">Fields marked with * are required. Leave others blank if data is unavailable.</p>
        </form>
    </div>
</body>
</html>
